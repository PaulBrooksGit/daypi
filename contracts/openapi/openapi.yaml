openapi: 3.1.0
info:
  title: DayPI API
  version: 0.4.0-phase3
  description: >
    Phase 0–3 implemented surfaces: foundation, DayCore/DayByte/DayTeam minimum,
    DayDocs, core DayBank (sandbox payments), DayText, and Phase 3 supporting
    services (DayMain, DayMake, DayStar, DayGrow, DayStep, DayCare). Commercial and
    regulatory behaviours gated by D01–D12 remain disabled or synthetic-only.
    No live Stripe Connect collection, auctions, payroll, consequential AI,
    background GPS, or Hostinger configuration.
servers:
  - url: http://localhost:3001/v1
    description: Local API (final hostname Pending D02)
tags:
  - name: Platform
  - name: Auth
  - name: Tenants
  - name: Sites
  - name: Memberships
  - name: Children
  - name: Guardians
  - name: Enrolments
  - name: Sessions
  - name: Bookings
  - name: Attendance
  - name: Staff
  - name: ImportExport
  - name: Files
  - name: Documents
  - name: Consents
  - name: Invoices
  - name: Payments
  - name: Usage
  - name: Messages
  - name: Webhooks
  - name: Websites
  - name: AI
  - name: Quality
  - name: Health
  - name: Trips
  - name: Facilities
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [Platform]
      security: []
      summary: Liveness
      responses:
        '200':
          description: OK
  /ready:
    get:
      tags: [Platform]
      security: []
      summary: Readiness
      responses:
        '200':
          description: Ready
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Password login
      responses:
        '200':
          description: Session issued
  /auth/logout:
    post:
      tags: [Auth]
      summary: End session
      responses:
        '204':
          description: Logged out
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user and memberships
      responses:
        '200':
          description: Profile
  /auth/tenant/select:
    post:
      tags: [Auth]
      summary: Select active tenant workspace
      responses:
        '200':
          description: Workspace selected
  /tenants/current:
    get:
      tags: [Tenants]
      summary: Active tenant profile
      responses:
        '200':
          description: Tenant
    patch:
      tags: [Tenants]
      summary: Update active tenant (owner)
      responses:
        '200':
          description: Updated
  /sites:
    get:
      tags: [Sites]
      summary: List sites
      responses:
        '200':
          description: Sites page
    post:
      tags: [Sites]
      summary: Create site
      responses:
        '201':
          description: Created
  /sites/{siteId}:
    get:
      tags: [Sites]
      summary: Get site
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Site
  /memberships:
    get:
      tags: [Memberships]
      summary: List memberships
      responses:
        '200':
          description: Memberships
  /memberships/invitations:
    post:
      tags: [Memberships]
      summary: Invite user
      responses:
        '201':
          description: Invitation created
  /memberships/{id}:
    delete:
      tags: [Memberships]
      summary: Revoke membership
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Revoked
  /integration-clients:
    get:
      tags: [Memberships]
      summary: List integration clients
      responses:
        '200':
          description: Clients
    post:
      tags: [Memberships]
      summary: Create integration client (secret once)
      responses:
        '201':
          description: Created
  /children:
    get:
      tags: [Children]
      summary: List children visible to caller
      responses:
        '200':
          description: Children page
    post:
      tags: [Children]
      summary: Create child in active tenant
      responses:
        '201':
          description: Created
  /children/{childId}:
    get:
      tags: [Children]
      summary: Get child if authorised
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Child
        '403':
          description: Forbidden
    patch:
      tags: [Children]
      summary: Update child (optimistic version)
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
  /children/{childId}/archive:
    post:
      tags: [Children]
      summary: Soft-archive child
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Archived
  /children/{childId}/guardians/{guardianId}:
    put:
      tags: [Guardians]
      summary: Upsert child–guardian relationship
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: guardianId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Relationship
    delete:
      tags: [Guardians]
      summary: Revoke child–guardian relationship
      parameters:
        - name: childId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: guardianId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Revoked
  /guardians:
    get:
      tags: [Guardians]
      summary: List guardians
      responses:
        '200':
          description: Guardians page
    post:
      tags: [Guardians]
      summary: Create guardian
      responses:
        '201':
          description: Created
  /guardians/{guardianId}:
    get:
      tags: [Guardians]
      summary: Get guardian
      parameters:
        - name: guardianId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Guardian
  /enquiries:
    get:
      tags: [Enrolments]
      summary: List enquiries
      responses:
        '200':
          description: Enquiries
    post:
      tags: [Enrolments]
      summary: Create enquiry
      responses:
        '201':
          description: Created
  /enquiries/{enquiryId}:
    patch:
      tags: [Enrolments]
      summary: Update enquiry status
      parameters:
        - name: enquiryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
  /enrolments:
    get:
      tags: [Enrolments]
      summary: List enrolments
      responses:
        '200':
          description: Enrolments
    post:
      tags: [Enrolments]
      summary: Create enrolment
      responses:
        '201':
          description: Created
  /enrolments/{enrolmentId}/end:
    post:
      tags: [Enrolments]
      summary: End enrolment
      parameters:
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ended
  /session-definitions:
    get:
      tags: [Sessions]
      summary: List session definitions
      responses:
        '200':
          description: Definitions
    post:
      tags: [Sessions]
      summary: Define session template
      responses:
        '201':
          description: Created
  /dated-sessions:
    get:
      tags: [Sessions]
      summary: List dated sessions with occupancy
      responses:
        '200':
          description: Dated sessions
    post:
      tags: [Sessions]
      summary: Materialise dated session
      responses:
        '201':
          description: Created
  /dated-sessions/{datedSessionId}:
    get:
      tags: [Sessions]
      summary: Get dated session
      parameters:
        - name: datedSessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dated session
  /bookings:
    get:
      tags: [Bookings]
      summary: List bookings (parents see linked children only)
      responses:
        '200':
          description: Bookings
    post:
      tags: [Bookings]
      summary: Create booking (parents request; staff confirm immediately)
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, maxLength: 128 }
      responses:
        '201':
          description: Created
        '409':
          description: Capacity conflict or duplicate
  /bookings/{bookingId}/confirm:
    post:
      tags: [Bookings]
      summary: Confirm a requested booking under transactional capacity lock
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Confirmed
        '409':
          description: No capacity
  /bookings/{bookingId}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel booking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancelled
  /reservations:
    post:
      tags: [Bookings]
      summary: Create expiring capacity hold
      responses:
        '201':
          description: Holding
        '409':
          description: No capacity
  /registers/{datedSessionId}:
    get:
      tags: [Attendance]
      summary: Operational register with staff on duty
      parameters:
        - name: datedSessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Register
  /attendance/check-in:
    post:
      tags: [Attendance]
      summary: Check child in
      responses:
        '201':
          description: Checked in
  /attendance/check-out:
    post:
      tags: [Attendance]
      summary: Check child out (authorised collector verified when provided)
      responses:
        '201':
          description: Checked out
  /attendance/{attendanceEventId}/corrections:
    post:
      tags: [Attendance]
      summary: Append-only attendance correction
      parameters:
        - name: attendanceEventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Correction applied
  /staff:
    get:
      tags: [Staff]
      summary: List staff profiles
      responses:
        '200':
          description: Staff
    post:
      tags: [Staff]
      summary: Create staff profile
      responses:
        '201':
          description: Created
  /rota/shifts:
    get:
      tags: [Staff]
      summary: List planned rota shifts
      responses:
        '200':
          description: Shifts
    post:
      tags: [Staff]
      summary: Create planned rota shift
      responses:
        '201':
          description: Created
  /time-events:
    post:
      tags: [Staff]
      summary: Record actual time event (separate from rota)
      responses:
        '201':
          description: Recorded
  /export/children:
    get:
      tags: [ImportExport]
      summary: Export children + guardian links (pilot)
      responses:
        '200':
          description: Bundle
  /import/children:
    post:
      tags: [ImportExport]
      summary: Import children bundle (supports dry_run)
      responses:
        '200':
          description: Dry-run result
        '201':
          description: Imported
  /files:
    post:
      tags: [Files]
      summary: Upload private object (base64 stub)
      responses:
        '201':
          description: Stored
  /files/{id}:
    get:
      tags: [Files]
      summary: Authorised short-lived download metadata
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Download descriptor
  /usage/account:
    get:
      tags: [Usage]
      summary: Usage account derived balance
      responses:
        '200':
          description: Account
  /usage/ledger:
    get:
      tags: [Usage]
      summary: Usage ledger statement
      responses:
        '200':
          description: Entries
  /usage/top-ups:
    post:
      tags: [Usage]
      summary: Sandbox purchase top-up (not promotional grant; live billing disabled)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Credited
  /documents:
    get:
      tags: [Documents]
      summary: List documents
      responses:
        '200':
          description: Page
    post:
      tags: [Documents]
      summary: Create document with initial version
      responses:
        '201':
          description: Created
  /documents/{documentId}:
    get:
      tags: [Documents]
      summary: Get document and current version
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Document
  /documents/{documentId}/versions:
    get:
      tags: [Documents]
      summary: List immutable versions
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Versions
    post:
      tags: [Documents]
      summary: Add new version (prior versions preserved)
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: New version
  /document-versions/{versionId}:
    get:
      tags: [Documents]
      summary: Retrieve a specific immutable version
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Version
  /consents:
    post:
      tags: [Consents]
      summary: Request consent against a document version
      responses:
        '201':
          description: Created
  /consents/{consentId}:
    get:
      tags: [Consents]
      summary: Consent with signature evidence and frozen version
      parameters:
        - name: consentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Consent bundle
  /consents/{consentId}/signatures:
    post:
      tags: [Consents]
      summary: Sign consent (preserves signed version hash)
      parameters:
        - name: consentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Signature evidence
  /billing-accounts:
    post:
      tags: [Invoices]
      summary: Create childcare billing account
      responses:
        '201':
          description: Created
  /billing-accounts/{billingAccountId}/reconciliation:
    get:
      tags: [Invoices]
      summary: Financial reconciliation for billing account
      parameters:
        - name: billingAccountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reconciliation
  /invoices:
    post:
      tags: [Invoices]
      summary: Draft invoice (pricing snapshot)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Drafted
  /invoices/{invoiceId}:
    get:
      tags: [Invoices]
      summary: Get invoice and lines
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Invoice
  /invoices/{invoiceId}/issue:
    post:
      tags: [Invoices]
      summary: Issue invoice (immutable money fields thereafter)
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Issued
  /invoices/{invoiceId}/credits:
    post:
      tags: [Invoices]
      summary: Credit issued invoice (amendment path)
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Credited
  /payments:
    post:
      tags: [Payments]
      summary: Create Stripe sandbox payment attempt (live collection disabled)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Pending sandbox payment
  /payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Get payment attempt
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Payment
  /messages:
    get:
      tags: [Messages]
      summary: Message history
      responses:
        '200':
          description: Page
    post:
      tags: [Messages]
      summary: Queue message (estimates cost; reserves usage credit for SMS)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Queued
  /messages/{messageId}:
    get:
      tags: [Messages]
      summary: Message with recipients and delivery state
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Message
  /messages/{messageId}/sandbox-send:
    post:
      tags: [Messages]
      summary: Process sandbox send immediately (dev/test helper)
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sent
  /webhooks/stripe:
    post:
      tags: [Webhooks]
      security: []
      summary: Stripe sandbox webhook (verify + dedupe)
      responses:
        '200':
          description: Processed or duplicate
  /webhooks/twilio:
    post:
      tags: [Webhooks]
      security: []
      summary: Twilio sandbox status webhook (verify + dedupe)
      responses:
        '200':
          description: Processed or duplicate
  /audit-events:
    get:
      tags: [Tenants]
      summary: Recent audit events for active tenant
      responses:
        '200':
          description: Events
  /website-templates:
    get:
      tags: [Websites]
      summary: List DayMain template catalogue (ten templates)
      responses:
        '200':
          description: Active templates
  /websites:
    get:
      tags: [Websites]
      summary: List tenant website sites
      responses:
        '200':
          description: Website sites
    post:
      tags: [Websites]
      summary: Create draft website site from template
      responses:
        '201':
          description: Created
  /websites/{id}/publish:
    post:
      tags: [Websites]
      summary: Publish website site
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Published
  /websites/{id}/pages:
    post:
      tags: [Websites]
      summary: Create draft page
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Created
  /website-pages/{id}:
    get:
      tags: [Websites]
      summary: Get website page
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Page
    patch:
      tags: [Websites]
      summary: Update draft page content
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
  /website-pages/{id}/publish:
    post:
      tags: [Websites]
      summary: Publish page (snapshot body)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Published
  /websites/{id}/domains:
    post:
      tags: [Websites]
      summary: Request custom domain verification (stub; no Hostinger)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Verification pending
  /website-domain-verifications/{id}/complete-stub:
    post:
      tags: [Websites]
      summary: Complete domain verification stub (sandbox only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: verified_stub
  /ai/drafts:
    get:
      tags: [AI]
      summary: List DayMake drafts
      responses:
        '200':
          description: Drafts
    post:
      tags: [AI]
      summary: Create synthetic unpublished AI draft
      responses:
        '201':
          description: Created
  /ai/drafts/{id}:
    get:
      tags: [AI]
      summary: Get AI draft
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Draft
    patch:
      tags: [AI]
      summary: Edit AI draft before publish
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
  /ai/drafts/{id}/approve:
    post:
      tags: [AI]
      summary: Approve draft as unpublished
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: approved_unpublished
  /ai/drafts/{id}/reject:
    post:
      tags: [AI]
      summary: Reject AI draft
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rejected
  /ai/orchestrator:
    post:
      tags: [AI]
      summary: Propose typed action; consequential types blocked (D07)
      responses:
        '201':
          description: Proposal
  /ai/proposals/{id}:
    get:
      tags: [AI]
      summary: Get AI proposal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Proposal
  /ai/proposals/{id}/approve:
    post:
      tags: [AI]
      summary: Approve draft-only proposal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: approved_draft_only
  /ai/proposals/{id}/reject:
    post:
      tags: [AI]
      summary: Reject proposal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rejected
  /ai/proposals/{id}/execute:
    post:
      tags: [AI]
      summary: Consequential execute — always FEATURE_DISABLED (D07)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '403':
          description: Feature disabled
  /quality/templates:
    post:
      tags: [Quality]
      summary: Create versioned audit template
      responses:
        '201':
          description: Created
  /quality/audits:
    post:
      tags: [Quality]
      summary: Start internal audit run
      responses:
        '201':
          description: Created
  /quality/audits/{id}/complete:
    post:
      tags: [Quality]
      summary: Complete audit with internal-only score
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Completed
  /quality/audits/{id}/actions:
    post:
      tags: [Quality]
      summary: Add follow-up action
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Created
  /testimonials:
    get:
      tags: [Quality]
      summary: List testimonials (permission-filtered)
      responses:
        '200':
          description: Testimonials
    post:
      tags: [Quality]
      summary: Submit testimonial (pending moderation)
      responses:
        '201':
          description: Created
